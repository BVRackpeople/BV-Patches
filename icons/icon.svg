<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0a66c2"/>

  <!-- Patch grid illustration: 4 coloured rectangles arranged in a 2×2-ish layout -->
  <!-- Top-left patch: wide rectangle -->
  <rect x="24" y="24" width="78" height="44" rx="6" fill="#caffbf"/>
  <!-- Top-right patch: tall rectangle -->
  <rect x="114" y="24" width="42" height="78" rx="6" fill="#ffd6a5"/>
  <!-- Bottom-left patch: square -->
  <rect x="24" y="80" width="44" height="44" rx="6" fill="#bdb2ff"/>
  <!-- Bottom-middle patch: wide rectangle -->
  <rect x="80" y="80" width="34" height="44" rx="6" fill="#9bf6ff"/>
  <!-- Bottom row spanning patch -->
  <rect x="24" y="136" width="132" height="20" rx="6" fill="#ffc6ff"/>
</svg>
